<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/portofolio/public"
    ServerName portofolio.test
    ServerAlias *.portofolio.test

    <Directory "C:/laragon/www/portofolio/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

